<div class="strip" *ngIf="views.length || hidden.length">
  <div class="chip-wrap" *ngFor="let v of views; trackBy: trackView">
    <button type="button" class="chip"
            [class.used]="v.used" [class.disconnected]="!v.entry" [class.active]="v.isActive"
            [class.reconnecting]="reconnecting.has(v.key)"
            [title]="statusTitle(v)"
            (click)="click(v, $event)">
      <i class="fas fa-circle-notch fa-spin spinner" *ngIf="reconnecting.has(v.key); else dot"></i>
      <ng-template #dot><span class="dot" [ngClass]="v.status"></span></ng-template>
      <span class="key">{{ v.key }}</span>
      <span class="label">{{ v.label }}</span>
      <i class="fas fa-plug" *ngIf="!v.entry && !reconnecting.has(v.key)" title="Closed – click to reopen"></i>
    </button>
    <button type="button" class="chip-remove"
            [disabled]="v.status === 'running'"
            [title]="v.status === 'running' ? 'Stop the agent before removing a terminal it is using' : 'Remove ' + v.key + ' from this session – the agent will no longer see or use it'"
            (click)="remove(v, $event)">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <div class="chip-wrap" *ngIf="hidden.length">
    <button type="button" class="chip hidden-chip" [class.active]="hiddenMenu"
            title="Terminals removed from this session – click to restore one"
            (click)="toggleHiddenMenu($event)">
      <i class="fas fa-eye-slash"></i>
      <span class="label">{{ hidden.length }} hidden</span>
    </button>

    <div class="menu" *ngIf="hiddenMenu" [style.top.px]="menuPos.top" [style.left.px]="menuPos.left" (click)="$event.stopPropagation()">
      <div class="menu-title">Not visible to the agent:</div>
      <button type="button" *ngFor="let v of hidden; trackBy: trackView" (click)="restore(v)"
              [title]="'Restore ' + v.key + ' – the agent can see and use it again'">
        <i class="fas fa-eye"></i>
        <span class="key">{{ v.key }}</span>
        <span class="label">{{ v.label }}</span>
        <span class="muted" *ngIf="!v.entry">closed</span>
      </button>
    </div>
  </div>
</div>
