<div class="strip" *ngIf="views.length">
  <div class="chip-wrap" *ngFor="let v of views; trackBy: trackView">
    <button type="button" class="chip"
            [class.used]="v.used" [class.disconnected]="!v.entry" [class.active]="v.isActive"
            [class.reconnecting]="reconnecting.has(v.key)"
            [title]="statusTitle(v)"
            (click)="click(v, $event)" (contextmenu)="openMenu(v, $event)">
      <i class="fas fa-circle-notch fa-spin spinner" *ngIf="reconnecting.has(v.key); else dot"></i>
      <ng-template #dot><span class="dot" [ngClass]="v.status"></span></ng-template>
      <span class="key">{{ v.key }}</span>
      <span class="label">{{ v.label }}</span>
      <i class="fas fa-plug" *ngIf="!v.entry && !reconnecting.has(v.key)" title="Closed – click to reopen"></i>
    </button>

    <div class="menu" *ngIf="menuFor === v.key" (click)="$event.stopPropagation()">
      <div class="menu-title">{{ v.key }} · {{ v.connection }}</div>
      <button type="button" *ngIf="!v.entry && v.canReconnect" (click)="reconnect(v)">
        <i class="fas fa-plug"></i> Reconnect (open the profile again)
      </button>
      <div class="menu-section" *ngIf="candidates.length">Attach to an open terminal:</div>
      <button type="button" *ngFor="let e of candidates" (click)="attach(v.key, e)">
        <i class="fas fa-link"></i> {{ e.label }}
      </button>
      <div class="menu-empty" *ngIf="!candidates.length && !v.canReconnect">No open terminals to attach.</div>
    </div>
  </div>
</div>
