<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Tabby AI Panel logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3042"/>
      <stop offset="1" stop-color="#141720"/>
    </linearGradient>
    <linearGradient id="prompt" gradientUnits="userSpaceOnUse" x1="46" y1="98" x2="128" y2="162">
      <stop offset="0" stop-color="#6ee7c8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- window -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="51.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
  <!-- terminal prompt -->
  <path d="M46 98 L84 128 L46 158" fill="none" stroke="url(#prompt)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M98 162 H128" fill="none" stroke="url(#prompt)" stroke-width="16" stroke-linecap="round"/>
  <!-- docked AI panel -->
  <rect x="150" y="34" width="72" height="188" rx="20" fill="#ffffff" fill-opacity="0.07"/>
  <path d="M186 70 C189 92 192 95 214 98 C192 101 189 104 186 126 C183 104 180 101 158 98 C180 95 183 92 186 70 Z" fill="url(#spark)"/>
  <rect x="164" y="148" width="44" height="10" rx="5" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="164" y="168" width="30" height="10" rx="5" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="164" y="188" width="38" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
</svg>
